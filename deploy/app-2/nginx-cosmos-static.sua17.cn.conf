# =============================================================================
# NewCosmos 应用节点 (.2) — https://cosmos-static.sua17.cn:20000
# -----------------------------------------------------------------------------
# 外网 20000 由防火墙 DNAT 到 .2:443，因此 nginx 监听 443。
# 职责：
#   /assets/*    -> /www/wwwroot/cosmos-static.sua17.cn/assets（hash 文件，immutable + CORS *）
#   /downloads/* -> /www/wwwroot/cosmos-static.sua17.cn/downloads（限速、限连接）
#   /api/*       -> 127.0.0.1:8787（ASP.NET Core，CORS 只允许 cosmos.sua17.cn）
#   其它         -> 404（.2 不提供页面，也不提供目录列表/备份）
#
# 安装位置：/etc/nginx/conf.d/cosmos-static.sua17.cn.conf
#   ！本文件顶部有 limit_req_zone / limit_conn_zone / upstream，
#     必须被 http { } 包含（conf.d 默认就是），不能塞进某个 server { }。
#
# 证书要求：证书 SAN 必须包含 cosmos-static.sua17.cn。
#   .1 与 .2 可共用同一张多 SAN 证书，改路径即可。
# =============================================================================

# ---------------------------------------------------------------------------
# 限流 / 限连接（http 级）
# ---------------------------------------------------------------------------
limit_req_zone  $binary_remote_addr zone=nc_downloads_req:10m  rate=10r/s;
limit_conn_zone $binary_remote_addr zone=nc_downloads_conn:10m;
limit_req_status  429;
limit_conn_status 429;

# ---------------------------------------------------------------------------
# CORS 白名单：只回显 https://cosmos.sua17.cn
# 无 Origin（Agent/curl）时变量为空，nginx 不输出 ACAO，不影响非浏览器客户端。
# ---------------------------------------------------------------------------
map $http_origin $nc_cors_origin {
    default                          "";
    ~*^https://cosmos\.sua17\.cn$    "https://cosmos.sua17.cn";
}

upstream newcosmos_api {
    server 127.0.0.1:8787;
    keepalive 32;
}

# ---------------------------------------------------------------------------
# HTTPS :443（外网 :20000）
# ---------------------------------------------------------------------------
server {
    # nginx >= 1.25.1 可改为：
    #   listen 443 ssl;
    #   http2 on;
    listen 443 ssl http2;
    # 如果 .2 没有做 20000->443 的端口映射，可同时直接监听 20000：
    # listen 20000 ssl http2;

    server_name cosmos-static.sua17.cn;

    # ---- TLS ----------------------------------------------------------------
    ssl_certificate     /www/server/panel/vhost/cert/mynas.sua17.cn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/mynas.sua17.cn/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:NC_APP_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling off;

    # ---- 站点根：只含 assets/ 与 downloads/，不要放 index.html --------------
    root /www/wwwroot/cosmos-static.sua17.cn;
    charset utf-8;

    server_tokens off;
    absolute_redirect off;
    port_in_redirect off;
    autoindex off;

    # 导入 Excel/照片/文书上传走这里。
    client_max_body_size 128m;
    client_body_buffer_size 256k;
    client_body_timeout 120s;
    client_header_timeout 20s;
    send_timeout 120s;
    keepalive_timeout 65s;
    keepalive_requests 1000;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # 静态文件元数据缓存：hash 文件多，减少 stat 次数。
    open_file_cache max=10000 inactive=30s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors off;

    access_log /www/wwwlogs/cosmos-static.sua17.cn.access.log;
    error_log  /www/wwwlogs/cosmos-static.sua17.cn.error.log warn;

    # ---- 安全头（server 级） ------------------------------------------------
    # 每个自己写了 add_header 的 location 都会重复声明，原因见 edge 配置注释。
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    # ---- 压缩 ---------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        application/wasm
        font/ttf
        font/otf;

    # Brotli 是可选模块（ngx_brotli），发行版默认没有。
    # 安装后把 deploy/app-2/brotli.conf.example 复制为
    # /etc/nginx/snippets/newcosmos-brotli.conf，再取消下一行注释并 nginx -t。
    # include /etc/nginx/snippets/newcosmos-brotli.conf;

    # -----------------------------------------------------------------------
    # 本地健康检查（不占带宽、不写 access log）
    # -----------------------------------------------------------------------
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # -----------------------------------------------------------------------
    # 启动动画：允许被 .1 页面 iframe 嵌入；不要沿用 server 级 X-Frame-Options DENY
    # -----------------------------------------------------------------------
    location ^~ /splash/ {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "frame-ancestors https://cosmos.sua17.cn" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
        access_log off;
    }

    # -----------------------------------------------------------------------
    # 静态资源：文件名带 hash，长期 immutable；字体/JS/CSS 允许跨域
    # -----------------------------------------------------------------------
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # 页面在 cosmos.sua17.cn，字体/JS/CSS 从本域加载，必须放开 CORS。
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

        # 防御：即使有人误传源码/备份到 assets，也不外泄。
        if ($uri ~* "\.(?:env|sql|bak|log|dump|map)$") { return 404; }
        if ($uri ~ "/\.") { return 404; }
        if (-d $request_filename) { return 404; }

        try_files $uri =404;

        access_log off;
        sendfile on;
        tcp_nopush on;
        # 静态资源不限速：.2 有 100Mbps，浏览器会并发拉很多 hash 文件。
    }

    # -----------------------------------------------------------------------
    # 下载目录：限请求速率 + 单 IP 并发连接 + 单连接带宽
    # -----------------------------------------------------------------------
    location ^~ /downloads/ {
        add_header Cache-Control "public, max-age=3600" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

        # 10 req/s + 20 突发；每个 IP 最多 4 条并发；单连接 8MiB/s，
        # 前 1MiB 不限速，避免小文件被限速拖慢。
        limit_req  zone=nc_downloads_req burst=20 nodelay;
        limit_conn nc_downloads_conn 4;
        limit_rate_after 1m;
        limit_rate 8m;

        if ($uri ~* "\.(?:env|sql|bak|log|dump|map)$") { return 404; }
        if ($uri ~ "/\.") { return 404; }
        if (-d $request_filename) { return 404; }

        try_files $uri =404;

        sendfile on;
        tcp_nopush on;
        access_log /www/wwwlogs/cosmos-static.downloads.log;
    }

    # -----------------------------------------------------------------------
    # 业务 API：反代本机 ASP.NET Core
    # -----------------------------------------------------------------------
    location ^~ /api/ {
        # ---- CORS（只允许页面源，不带 credentials） ------------------------
        add_header Access-Control-Allow-Origin  $nc_cors_origin always;
        add_header Vary                         "Origin" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-NC-Device, X-NC-Device-Key, X-NC-Agent-Register" always;
        add_header Access-Control-Max-Age       600 always;
        add_header Access-Control-Expose-Headers "Content-Disposition, X-Trace-Id" always;

        # 安全头（本 location 有 add_header，必须重复）
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

        # 上游自己的 CORS/实现头全部丢掉，统一由 nginx 输出，避免重复头。
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;

        # ---- 预检：由 nginx 直接 204，不打到后端 --------------------------
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  $nc_cors_origin always;
            add_header Vary                         "Origin" always;
            add_header Access-Control-Allow-Methods "GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-NC-Device, X-NC-Device-Key, X-NC-Agent-Register" always;
            add_header Access-Control-Max-Age       600 always;
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            return 204;
        }

        proxy_pass http://newcosmos_api;
        proxy_http_version 1.1;

        proxy_set_header Host              cosmos-static.sua17.cn:20000;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # 保留外部 Host:port；外网端口固定为 20000。
        proxy_set_header X-Forwarded-Host  cosmos-static.sua17.cn:20000;
        proxy_set_header X-Forwarded-Port  20000;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        # 导入/导出/报表可能较慢，给足 5 分钟；静态资源不走这里。
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        proxy_buffering on;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;

        # 上传先落 nginx 临时文件再转发，避免大请求长期占用后端线程。
        proxy_request_buffering on;

        # 后端 502/503/504 时返回 JSON（带 CORS，前端能读）。
        error_page 502 503 504 = @api_unavailable;
    }

    location @api_unavailable {
        default_type application/json;
        add_header Access-Control-Allow-Origin $nc_cors_origin always;
        add_header Vary "Origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        return 503 '{"code":"UPSTREAM_UNAVAILABLE","message":"api service unavailable"}';
    }

    # /api 与 /api/ 本身不提供内容
    location = /api {
        default_type application/json;
        add_header Access-Control-Allow-Origin $nc_cors_origin always;
        add_header Vary "Origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 404 '{"code":"NOT_FOUND","message":"no such endpoint"}';
    }

    # -----------------------------------------------------------------------
    # 备份/数据库目录：显式 404（备份实际在 /srv/newcosmos/backups，不在 root 下）
    # -----------------------------------------------------------------------
    location ^~ /backups/ { access_log off; return 404; }
    location ^~ /backup/  { access_log off; return 404; }

    # -----------------------------------------------------------------------
    # 敏感后缀 / 隐藏文件 / source map
    # -----------------------------------------------------------------------
    location ~* \.(?:env|sql|bak|log|dump|old|orig|save|swp|swo|tmp)$ {
        access_log off;
        return 404;
    }

    location ~* \.map$ {
        access_log off;
        return 404;
    }

    location ~ /\.(?!well-known/) {
        access_log off;
        return 404;
    }

    # -----------------------------------------------------------------------
    # 其它一律 404：.2 不发页面、不做 SPA 回退、不列目录
    # -----------------------------------------------------------------------
    location / {
        return 404;
    }
}
