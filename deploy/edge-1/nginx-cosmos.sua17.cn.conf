# =============================================================================
# NewCosmos 边缘节点 (.1) — https://cosmos.sua17.cn
# -----------------------------------------------------------------------------
# 职责（只做这些）：
#   1. 下发 index.html（SPA 入口），绝不缓存；
#   2. 把 /api/auth/* 反代到 .2:8787；
#   3. 其它 /api/*、/assets/*、/downloads/*、备份目录一律 404。
#
# 安装位置：/etc/nginx/conf.d/cosmos.sua17.cn.conf
#   （conf.d 由 http { } 自动 include，本文件使用 server 级指令即可）
#
# 证书要求：证书必须覆盖 cosmos.sua17.cn。
#   .1 与 .2 可以共用一张同时包含两个域名的多 SAN 证书，
#   此时把下面的路径改成同一张证书即可。
#
# 注意：.1 只有 3Mbps，任何静态资源/业务请求都不得经过这里。
# =============================================================================

# 登录/刷新限流：边缘节点只反代认证，防止暴力破解打满 .1 后端。
limit_req_zone  $binary_remote_addr zone=nc_edge_auth_req:10m  rate=5r/s;
limit_req_status 429;

# ---------------------------------------------------------------------------
# HTTP :80 — 只做 ACME 验证与跳转 HTTPS
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name cosmos.sua17.cn;

    # certbot --webroot 使用；目录需提前创建：
    #   install -d -m 0755 /var/www/certbot
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        access_log off;
    }

    location / {
        return 301 https://cosmos.sua17.cn$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS :443
# ---------------------------------------------------------------------------
server {
    # nginx >= 1.25.1 可改为：
    #   listen 443 ssl;
    #   http2 on;
    listen 443 ssl http2;
    server_name cosmos.sua17.cn;

    # ---- TLS ----------------------------------------------------------------
    ssl_certificate     /www/server/panel/vhost/cert/sua17.cn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/sua17.cn/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:NC_EDGE_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # Let's Encrypt 已停止 OCSP，保持关闭即可。
    ssl_stapling off;

    # ---- 站点根目录：只放 index.html ---------------------------------------
    root /www/wwwroot/cosmos.sua17.cn;
    index index.html;
    charset utf-8;

    server_tokens off;
    absolute_redirect off;

    # 登录/心跳请求很小；超过 2m 一律拒绝，避免 .1 被打穿。
    client_max_body_size 2m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;
    keepalive_timeout 30s;
    keepalive_requests 1000;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    access_log /www/wwwlogs/cosmos.sua17.cn.access.log;
    error_log  /www/wwwlogs/cosmos.sua17.cn.error.log warn;

    # ---- 安全头（server 级） ------------------------------------------------
    # 注意：nginx 的 add_header 不会从父级继承到“自己又写了 add_header”的
    # location，因此下面每个带 add_header 的 location 都重复声明了安全头。
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # CSP 先不启用：Element Plus 会写内联样式，且业务 API 在另一个源。
    # 需要时按下面模板启用并做完整回归（含登录、打印预览、PDF 预览）：
    # add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://cosmos-static.sua17.cn:20000; font-src 'self' https://cosmos-static.sua17.cn:20000; connect-src 'self' https://cosmos-static.sua17.cn:20000; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # ---- 压缩：index 与认证 JSON 很小，但 gzip 仍能省 .1 的 3Mbps ----------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        application/wasm;

    # -----------------------------------------------------------------------
    # 入口页：绝不缓存，保证发版后用户立刻拿到新 index
    # -----------------------------------------------------------------------
    location = / {
        # 内部跳到 /index.html，让下面 exact location 的 no-store 生效。
        rewrite ^ /index.html last;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;

        try_files $uri =404;
    }

    # -----------------------------------------------------------------------
    # 认证：唯一允许穿透到 .2 的路径
    # 路径原样转发（/api/auth/login -> http://10.110.0.2:8787/api/auth/login）
    # -----------------------------------------------------------------------
    location ^~ /api/auth/ {
        limit_req zone=nc_edge_auth_req burst=10 nodelay;
        add_header Cache-Control "no-store" always;
        add_header Pragma "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;

        proxy_pass http://10.110.0.2:8787;
        proxy_http_version 1.1;

        # 认证响应绝不能被中间层缓存。
        proxy_hide_header Cache-Control;
        proxy_hide_header Pragma;
        proxy_hide_header Expires;
        # 不向公网泄露上游实现细节。
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;

        proxy_set_header Host              cosmos.sua17.cn;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  cosmos.sua17.cn;
        proxy_set_header X-Forwarded-Port  443;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        proxy_buffering on;
        proxy_buffers 8 8k;
        proxy_busy_buffers_size 16k;

        # 后端挂了返回 JSON，避免前端解析 nginx 的 HTML 错误页。
        error_page 502 503 504 = @edge_auth_unavailable;
    }

    location @edge_auth_unavailable {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self), payment=(), usb=()" always;
        return 503 '{"code":"AUTH_UPSTREAM_UNAVAILABLE","message":"auth service unavailable"}';
    }

    # -----------------------------------------------------------------------
    # 其它 API：边缘节点一律不提供
    # -----------------------------------------------------------------------
    location = /api {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        return 404 '{"code":"NOT_FOUND","message":"only /api/auth/* is served by the edge"}';
    }

    location ^~ /api/ {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self), payment=(), usb=()" always;
        return 404 '{"code":"NOT_FOUND","message":"only /api/auth/* is served by the edge"}';
    }

    # -----------------------------------------------------------------------
    # 大流量目录：.1 绝不承载
    # -----------------------------------------------------------------------
    location ^~ /assets/    { access_log off; return 404; }
    location ^~ /downloads/ { access_log off; return 404; }
    location ^~ /uploads/   { access_log off; return 404; }
    location ^~ /photos/    { access_log off; return 404; }
    location ^~ /files/     { access_log off; return 404; }
    location ^~ /backups/   { access_log off; return 404; }
    location ^~ /backup/    { access_log off; return 404; }

    location = /assets    { access_log off; return 404; }
    location = /downloads { access_log off; return 404; }
    location = /uploads   { access_log off; return 404; }
    location = /photos    { access_log off; return 404; }
    location = /files     { access_log off; return 404; }
    location = /backups   { access_log off; return 404; }
    location = /backup    { access_log off; return 404; }

    # 根目录下如果误放了除 index.html 之外的静态文件，也不对外提供。
    location ~* ^/[^/]+\.(?:js|mjs|css|map|json|txt|xml|webmanifest|png|jpe?g|gif|svg|webp|avif|ico|woff2?|ttf|otf|eot)$ {
        access_log off;
        return 404;
    }

    # 敏感后缀 / 隐藏文件
    location ~* \.(?:env|sql|bak|log|dump|old|orig|save|swp|swo|tmp)$ {
        access_log off;
        return 404;
    }

    location ~ /\.(?!well-known/) {
        access_log off;
        return 404;
    }

    # -----------------------------------------------------------------------
    # SPA 路由回退：未知路径都回 index.html（内部跳转，仍走 no-store）
    # -----------------------------------------------------------------------
    location / {
        try_files $uri /index.html;
    }
}
