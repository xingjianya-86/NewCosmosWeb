<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>帝皇权杖δ-me13</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b1220;
        --panel: #111c31;
        --text: #e7eefb;
        --muted: #93a4c0;
        --gold: #d9b45b;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid;
        place-items: center;
        padding: 32px 24px calc(32px + env(safe-area-inset-bottom));
        background: radial-gradient(circle at 50% 0%, #16233c 0%, var(--bg) 58%);
        color: var(--text);
        font-family: "Noto Sans SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
        text-align: center;
      }
      main { max-width: 360px; }
      .mark {
        width: 72px;
        height: 72px;
        margin: 0 auto 20px;
        border-radius: 20px;
        display: grid;
        place-items: center;
        background: var(--panel);
        border: 1px solid #24365a;
        color: var(--gold);
        font-size: 30px;
        font-weight: 700;
      }
      h1 { margin: 0 0 8px; font-size: 20px; font-weight: 600; letter-spacing: 0.5px; }
      p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.7; }
      .hint { margin-top: 18px; font-size: 12px; color: #6f81a0; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">δ</div>
      <h1>帝皇权杖δ-me13</h1>
      <p>壳内占位页。业务页面由 <code>https://cosmos.sua17.cn</code> 提供。</p>
      <p class="hint">若看到此页，说明原生启动地址未生效；请重新执行 npx cap sync android。</p>
    </main>
  </body>
</html>
