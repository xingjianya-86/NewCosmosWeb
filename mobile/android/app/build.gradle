apply plugin: 'com.android.application'

/*
 * NewCosmos Android 壳构建配置。
 * 版本号单一来源：mobile/package.json（末段数字同时作为 versionCode）；
 * deploy/android/build-apk.ps1 仍可通过 -PncVersionName / -PncVersionCode 覆盖。
 * 签名：优先使用 -PncKeystore / 环境变量 NC_ANDROID_KEYSTORE 指向的 keystore，
 * 未配置时 Release 回退到 debug 签名，保证内部构建产出的 APK 可直接安装。
 */
def ncVersionName = project.findProperty('ncVersionName')
def ncVersionCode = project.findProperty('ncVersionCode')
if (ncVersionName == null) {
    try {
        def pkg = new groovy.json.JsonSlurper().parse(file('../../package.json'))
        ncVersionName = pkg.version.toString()
    } catch (Exception ignored) {
        ncVersionName = '2.0.20261126'
    }
}
if (ncVersionCode == null) {
    def segments = ncVersionName.toString().split('\\.')
    ncVersionCode = segments[segments.length - 1].replaceAll('[^0-9]', '')
}

def ncKeystorePath = (project.findProperty('ncKeystore') ?: System.getenv('NC_ANDROID_KEYSTORE') ?: '').toString()
def ncKeystorePass = (project.findProperty('ncKeystorePassword') ?: System.getenv('NC_ANDROID_KEYSTORE_PASS') ?: '').toString()
def ncKeyAlias = (project.findProperty('ncKeyAlias') ?: System.getenv('NC_ANDROID_KEY_ALIAS') ?: 'newcosmos').toString()
def ncKeyPass = (project.findProperty('ncKeyPassword') ?: System.getenv('NC_ANDROID_KEY_PASS') ?: ncKeystorePass).toString()
def ncHasReleaseSigning = !ncKeystorePath.isEmpty() && !ncKeystorePass.isEmpty() && file(ncKeystorePath).exists()

def ncUpdateUrl = (project.findProperty('ncUpdateUrl') ?: 'https://cosmos-static.sua17.cn:20000/downloads/android/latest.json').toString()
def ncServerUrl = (project.findProperty('ncServerUrl') ?: 'https://cosmos.sua17.cn').toString()

android {
    namespace = "cn.sua17.newcosmos"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "cn.sua17.newcosmos"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode ncVersionCode.toString().toInteger()
        versionName ncVersionName.toString()
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
        buildConfigField "String", "NC_CLIENT", '"android"'
        buildConfigField "String", "NC_UPDATE_URL", '"' + ncUpdateUrl + '"'
        buildConfigField "String", "NC_SERVER_URL", '"' + ncServerUrl + '"'
    }

    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        encoding = 'UTF-8'
    }

    signingConfigs {
        if (ncHasReleaseSigning) {
            release {
                storeFile file(ncKeystorePath)
                storePassword ncKeystorePass
                keyAlias ncKeyAlias
                keyPassword ncKeyPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (ncHasReleaseSigning) {
                signingConfig signingConfigs.release
            } else {
                if (gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }) {
                    logger.warn("NC: no release keystore configured, release APK will be signed with the debug key")
                }
                signingConfig signingConfigs.debug
            }
        }
        debug {
            // 调试包与正式包共用 applicationId，便于覆盖安装、联调会话保持。
            versionNameSuffix ""
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
